<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{height:100%}body{margin:0}img{max-width:100%}</style>
<title>第5章 亂世故事卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one card at a time floating on a peach-to-teal painted sky; single deliberate look (gongbi flower-and-bird palette) */
:root{
  --sky-top:#F2CDBB; --sky-mid:#9DB8B0; --sky-low:#2F7A78; --sky-deep:#1F5E60;
  --card:#FBF6EE; --ink:#2E3B3A; --soft:#6E7C78; --line:#E6DCCD;
  --han:#E58B4A; --jin:#D9667A; --south:#2F8A86; --north:#8C9A2E; --tang:#B9739E; --nature:#5E9A6A;
  --zhou:#A0784E; --qin:#5E7290; --xihan:#E07B45; --donghan:#B8962E;
  --ok:#3E8F6A; --bad:#C9545E; --hl:#F8D9C4;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--sky-deep)}
body{min-height:100%;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  background:
    radial-gradient(circle at 88% 6%, rgba(255,214,190,.55) 0 60px, transparent 61px),
    radial-gradient(circle at 8% 38%, rgba(214,232,206,.35) 0 90px, transparent 91px),
    linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 38%,var(--sky-low) 72%,var(--sky-deep) 100%) fixed;}
.brand{display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--display);font-weight:900;font-size:24px;color:var(--ink);letter-spacing:.12em}
.brand-art{width:84px;height:108px;flex:0 0 auto;object-fit:cover;object-position:50% 45%;border-radius:42px 42px 16px 16px;border:3px solid var(--card);box-shadow:0 6px 16px rgba(122,90,76,.3)}
.finish-art{align-self:center;width:100%;max-width:260px;aspect-ratio:3/4;object-fit:cover;object-position:50% 40%;border-radius:130px 130px 22px 22px;border:4px solid #fff;box-shadow:0 10px 24px rgba(31,94,96,.3)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:.2em;color:#7A5A4C}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:8px}
.chaps{display:flex;justify-content:center;gap:8px}
.chaps button{font:700 15px var(--body);padding:6px 16px;border-radius:99px;border:0;background:transparent;color:#7A5A4C;cursor:pointer}
.chaps button[aria-pressed="true"]{background:#7A5A4C;color:var(--card)}
.tabs button{flex:1;font:700 16px var(--body);padding:12px;border-radius:99px;border:1.5px solid rgba(255,255,255,.7);background:rgba(251,246,238,.45);color:var(--ink);cursor:pointer;backdrop-filter:blur(4px)}
.tabs button[aria-selected="true"]{background:var(--card);border-color:var(--card);box-shadow:0 2px 8px rgba(122,90,76,.18)}
.ribbon{display:flex;gap:4px}
.ribbon i{flex:1;height:7px;border-radius:4px;opacity:.3;transition:.2s}
.ribbon i.on{opacity:1}
.card{position:relative;overflow:hidden;background:var(--card);border-radius:26px 26px 22px 22px;padding:26px 20px 22px;min-height:420px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(31,94,96,.28)}
.card::before{content:"";position:absolute;top:-70px;right:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 40% 40%,color-mix(in srgb,var(--c) 38%,#fff) ,color-mix(in srgb,var(--c) 14%,var(--card)) 70%);opacity:.7;pointer-events:none}
.card>*{position:relative}
.era{align-self:flex-start;font-weight:700;font-size:14px;letter-spacing:.1em;color:#fff;background:var(--c);padding:3px 14px;border-radius:99px}
h1{font-family:var(--display);font-weight:900;font-size:28px;line-height:1.3;margin:0;text-wrap:balance}
.flow{display:flex;flex-direction:column;gap:6px}
.step{background:color-mix(in srgb,var(--c) 12%,var(--card));border-radius:12px;padding:10px 14px;font-weight:500}
.arrow{text-align:center;color:var(--c);font-weight:900;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);color:var(--ink);border-radius:10px;padding:4px 10px;font-weight:700;font-size:15px}
.label{font-size:13px;font-weight:700;color:var(--soft);letter-spacing:.06em}
.trap{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-radius:12px;padding:10px 14px;font-size:15px}
.trap b{color:var(--bad)}
mark{background:var(--hl);color:inherit;padding:0 3px;border-radius:4px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.door{border-radius:14px;padding:12px;background:color-mix(in srgb,var(--dc) 13%,var(--card));border:2px solid var(--dc);min-width:0;font-size:15px}
.door strong{display:block;font-family:var(--display);font-size:19px;color:var(--dc);margin-bottom:4px}
.nav{display:flex;gap:10px}
.nav button{flex:1;font:700 18px var(--body);padding:16px;border-radius:99px;border:0;cursor:pointer;background:var(--han);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.nav button.ghost{flex:0 0 33%;background:rgba(251,246,238,.9);color:var(--ink)}
.nav button:disabled{opacity:.4}
button:focus-visible{outline:3px solid var(--card);outline-offset:2px}
.count{text-align:center;color:#E4F0EC;font-size:14px;letter-spacing:.05em}
.clue{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opts button{font:700 18px var(--body);text-align:left;padding:16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.why{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--ok) 10%,var(--card));font-size:16px}
.why.no{background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.score{display:flex;justify-content:space-between;font-weight:700;color:var(--soft);font-size:15px;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:56px;font-weight:900;text-align:center;line-height:1}
@media (prefers-reduced-motion:no-preference){.card{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

const $=id=>document.getElementById(id);
const decks={c23:[cards23,quiz23],c5:[cards5,quiz5]};
let deck='c23', cards=cards23, quiz=quiz23;
let mode='story', i=0;
function setDeck(d){
  deck=d; [cards,quiz]=decks[d]; i=0;
  try{const s=parseInt(localStorage.getItem('card_'+d));if(s>=0&&s<cards.length)i=s}catch(e){}
  $('chA').setAttribute('aria-pressed',d==='c23'); $('chB').setAttribute('aria-pressed',d==='c5');
  try{localStorage.setItem('deck',d)}catch(e){}
  setMode(mode);
}
let q={order:[],pos:0,right:0,tries:0,answered:false};

function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}

function renderStory(){
  const d=cards[i];
  $('ribbon').innerHTML=cards.map((x,k)=>`<i class="${k<=i?'on':''}" style="background:${C[x.c]}"></i>`).join('');
  $('stage').innerHTML=`<article class="card" style="--c:${C[d.c]}"><span class="era">${d.era}</span><h1>${d.h}</h1>${d.b}</article>`;
  $('nav').innerHTML=`<button class="ghost" id="prev" ${i===0?'disabled':''}>上一張</button><button id="next">${i===cards.length-1?'去快問 →':'下一張'}</button>`;
  $('count').textContent=`${i+1} / ${cards.length}`;
  $('prev').onclick=()=>{if(i>0){i--;renderStory()}};
  $('next').onclick=()=>{if(i<cards.length-1){i++;renderStory()}else setMode('quiz')};
  try{localStorage.setItem('card_'+deck,i)}catch(e){}
}

function startQuiz(){q={order:shuffle(quiz.map((_,k)=>k)),pos:0,right:0,tries:0,answered:false}}

function renderQuiz(){
  $('ribbon').innerHTML='';
  if(q.pos>=q.order.length){
    $('stage').innerHTML=`<article class="card" style="--c:var(--ok)"><span class="era">過關</span><img class="finish-art" src="${$('art').src}" alt="花鳥少女插畫"><div class="big">${q.right}/${q.tries}</div><h1>全部答對過一次了！</h1><div class="step">答錯的題目剛剛已經重出一次。想再練，按「再玩一次」。</div></article>`;
    $('nav').innerHTML='<button id="again">再玩一次</button>';
    $('count').textContent='';
    $('again').onclick=()=>{startQuiz();renderQuiz()};
    return;
  }
  const [clue,a,b,why]=quiz[q.order[q.pos]];
  const opts=shuffle([a,b]);
  $('stage').innerHTML=`<article class="card" style="--c:var(--north)"><div class="score"><span>第 ${q.pos+1} 題 / 剩 ${q.order.length-q.pos-1} 題</span><span>答對 ${q.right}</span></div><div class="label">題目看到這句話</div><div class="clue">「${clue}」</div><div class="opts">${opts.map(o=>`<button data-o="${o}">${o}</button>`).join('')}</div><div id="why"></div></article>`;
  $('nav').innerHTML='';
  $('count').textContent='答錯的題目會在後面再出現一次';
  q.answered=false;
  document.querySelectorAll('.opts button').forEach(btn=>btn.onclick=()=>{
    if(q.answered)return; q.answered=true; q.tries++;
    const ok=btn.dataset.o===a;
    document.querySelectorAll('.opts button').forEach(x=>{if(x.dataset.o===a)x.classList.add('right')});
    if(ok){q.right++}else{btn.classList.add('wrong');q.order.push(q.order[q.pos])}
    $('why').innerHTML=`<div class="why ${ok?'':'no'}"><b>${ok?'✓ 對！':'✗ 答案是「'+a+'」'}</b><br>${why}</div>`;
    $('nav').innerHTML='<button id="nq">下一題</button>';
    $('nq').onclick=()=>{q.pos++;renderQuiz()};
  });
}

function setMode(m){
  mode=m;
  $('tabStory').setAttribute('aria-selected',m==='story');
  $('tabQuiz').setAttribute('aria-selected',m==='quiz');
  if(m==='story')renderStory();else{startQuiz();renderQuiz()}
  window.scrollTo(0,0);
}
$('tabStory').onclick=()=>setMode('story');
$('tabQuiz').onclick=()=>setMode('quiz');

let sx=null;
$('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',e=>{
  if(mode!=='story'||sx===null)return;
  const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(dx<-60&&i<cards.length-1){i++;renderStory()}
  if(dx>60&&i>0){i--;renderStory()}
});

$('chA').onclick=()=>setDeck('c23');
$('chB').onclick=()=>setDeck('c5');
let startDeck='c23';
try{const d=localStorage.getItem('deck');if(d&&decks[d])startDeck=d}catch(e){}
setDeck(startDeck);
</script>
